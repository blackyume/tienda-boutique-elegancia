<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión · La Boutique de la Elegancia</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #020617;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            max-width: 460px;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(232, 198, 94, 0.25);
            border-radius: 20px;
            padding: 48px 32px;
            backdrop-filter: blur(20px);
        }
        .eyebrow {
            display: inline-block;
            color: #E8C65E;
            font-size: 10px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 16px;
        }
        h1 {
            font-family: "Playfair Display", Georgia, serif;
            font-weight: 500;
            font-size: 32px;
            line-height: 1.15;
            margin: 0 0 16px;
            color: #fff;
        }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin: 0 0 28px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(90deg, #BF953F, #FCF6BA 50%, #B38728);
            color: #000;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            border: 0;
            cursor: pointer;
            border-radius: 2px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.03); }
        .sparkle {
            color: #E8C65E;
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <main class="card">
        <span class="sparkle">✦</span>
        <span class="eyebrow">Sin conexión</span>
        <h1>No pudimos cargar la tienda</h1>
        <p>
            Parece que estás sin internet. Revisá tu conexión y volvé a
            intentar — tu experiencia te espera.
        </p>
        <button class="btn" onclick="location.reload()">Reintentar</button>
    </main>
</body>

</html>
