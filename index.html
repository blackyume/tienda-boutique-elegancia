<body>
  <!-- Loading Screen -->
  <div id="loadingScreen" class="loading-screen"
    style="position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s;">
    <div class="loading-content" style="text-align: center; color: white;">
      <div class="loading-logo" style="margin-bottom: 1.5rem; display: flex; justify-content: center;">
        <img src="/assets/logo-main.png?v=4" alt="LBE" style="width: 120px; height: auto;">
      </div>
      <div class="loading-text"
        style="font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: 2px; color: #D4AF37; font-size: 14px;">
        La Boutique de la Elegancia</div>
      <div class="loading-spinner"
        style="width: 40px; height: 40px; border: 4px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto;">
      </div>
    </div>
  </div>
  <style>
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>

  <div id="root"></div>

  <!-- Loading Logic -->
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('loadingScreen');
      if (loader) {
        setTimeout(() => {
          loader.style.opacity = '0';
          setTimeout(() => { loader.remove(); }, 500);
        }, 800);
      }
    });
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
