  <!-- Google Analytics 4 -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-SGLGH9DZP8');

    // gtag.js pesa ~480 KB y antes se peleaba con la portada por el ancho de
    // banda durante la carga. Se trae cuando el navegador queda libre o al
    // primer gesto de la visitante, lo que pase primero. No se pierde nada:
    // los eventos de antes quedan encolados en dataLayer y se mandan al cargar.
    (function () {
      var pedido = false;
      function traerGtag() {
        if (pedido) return;
        pedido = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-SGLGH9DZP8';
        document.head.appendChild(s);
      }
      ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (ev) {
        addEventListener(ev, traerGtag, { once: true, passive: true });
      });
      if ('requestIdleCallback' in window) requestIdleCallback(traerGtag, { timeout: 4000 });
      else setTimeout(traerGtag, 3000);
    })();
  </script>

  <!-- Custom Assets for Modifications -->
  <link rel="stylesheet" href="/assets/custom.css">

<body>
  <!-- Pantalla de entrada: logo que respira + hilo dorado que corre. Mismo
       gesto que LogoCargando.jsx (src/index.css: respirar, hilo-cargando). -->
  <style>
    @keyframes ls-respirar {
      0%, 100% { opacity: .82; filter: drop-shadow(0 0 6px rgba(232,198,94,.18)); }
      50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(232,198,94,.45)); }
    }
    @keyframes ls-entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes ls-hilo { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #loadingScreen .ls-logo { width: min(280px, 68vw); height: auto; animation: ls-entra .9s ease-out both, ls-respirar 3.2s ease-in-out .9s infinite; }
    #loadingScreen .ls-hilo { position: relative; width: 110px; height: 1px; overflow: hidden; background: rgba(232,198,94,.14); margin-top: 30px; animation: ls-entra .9s ease-out .25s both; }
    #loadingScreen .ls-hilo::after { content: ''; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, #E8C65E, transparent); animation: ls-hilo 1.8s cubic-bezier(.45,0,.25,1) infinite; }
    #loadingScreen .ls-lema { margin-top: 22px; font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: 5px; color: rgba(232,198,94,.7); font-size: 10px; animation: ls-entra .9s ease-out .45s both; }
    @media (prefers-reduced-motion: reduce) { #loadingScreen * { animation: none !important; } }
  </style>

  <div id="loadingScreen"
    style="position: fixed; inset: 0; background: #11100D; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.6s ease;">
    <div role="status" aria-label="Cargando" style="display: flex; flex-direction: column; align-items: center;">
      <img class="ls-logo" src="/assets/logo-main.png?v=5" alt="La Boutique de la Elegancia" />
      <div class="ls-hilo"></div>
      <div class="ls-lema">Moda femenina · Argentina</div>
    </div>
  </div>

  <div id="root"></div>

  <!-- Loading Logic -->
  <script>
    // Red de seguridad: la app la saca apenas pinta (ver App.jsx); si algo
    // fallara antes, se va sola cuando termina de cargar todo.
    window.addEventListener('load', () => {
      const loader = document.getElementById('loadingScreen');
      if (loader && !loader.dataset.saliendo) {
        loader.dataset.saliendo = '1';
        loader.style.opacity = '0';
        setTimeout(() => { loader.remove(); }, 500);
      }
    });
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
