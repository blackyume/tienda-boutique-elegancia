  <!-- Custom Assets for Modifications -->
  <link rel="stylesheet" href="/assets/custom.css">
  <script src="/assets/custom.js" defer></script>
</head>

<body>
  <!-- Loading Screen -->
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sparkle-subtle {
      0%   { opacity: 0.15; transform: scale(0.5) rotate(0deg); }
      50%  { opacity: 1;    transform: scale(1.3) rotate(45deg); }
      100% { opacity: 0.15; transform: scale(0.5) rotate(0deg); }
    }
    @keyframes logo-breathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(212,175,55,0.3)); }
      50%       { transform: scale(1.04); filter: drop-shadow(0 0 28px rgba(212,175,55,0.7)); }
    }
    @keyframes fadeUpIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .ls-sparkle {
      position: absolute;
      animation: sparkle-subtle 3s ease-in-out infinite;
    }
    .ls-sparkle svg { display: block; }
  </style>

  <div id="loadingScreen"
    style="position: fixed; inset: 0; background: #020617; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.6s ease;">

    <div style="text-align: center; color: white; display: flex; flex-direction: column; align-items: center;">

      <!-- Logo con sparkles -->
      <div style="position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 2rem;">

        <!-- Glow ring -->
        <div style="position: absolute; inset: -8px; border-radius: 50%; border: 1px solid rgba(212,175,55,0.15); animation: logo-breathe 3s ease-in-out infinite;"></div>
        <div style="position: absolute; inset: -20px; border-radius: 50%; border: 1px solid rgba(212,175,55,0.06);"></div>

        <!-- Sparkles - siempre prendidas, distintos delays -->
        <span class="ls-sparkle" style="top: 8px; right: 14px; animation-delay: 0ms;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
        </span>
        <span class="ls-sparkle" style="top: 18px; left: 12px; animation-delay: 500ms;">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#D4AF37"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
        </span>
        <span class="ls-sparkle" style="bottom: 14px; right: 10px; animation-delay: 1000ms;">
          <svg width="8" height="8" viewBox="0 0 24 24" fill="rgba(255,255,255,0.8)"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
        </span>
        <span class="ls-sparkle" style="bottom: 20px; left: 10px; animation-delay: 1500ms;">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#D4AF37"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
        </span>
        <span class="ls-sparkle" style="top: 50%; right: 4px; animation-delay: 2000ms;">
          <svg width="7" height="7" viewBox="0 0 24 24" fill="rgba(212,175,55,0.7)"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
        </span>
        <span class="ls-sparkle" style="top: 6px; left: 50%; animation-delay: 2500ms;">
          <svg width="7" height="7" viewBox="0 0 24 24" fill="rgba(255,255,255,0.6)"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>
        </span>

        <!-- Logo image con glow animado -->
        <img src="/assets/logo-main.png?v=4" alt="LBE"
          style="width: 130px; height: auto; position: relative; z-index: 1; animation: logo-breathe 3s ease-in-out infinite;" />
      </div>

      <!-- Nombre de la marca -->
      <div style="font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: 3px; color: #D4AF37; font-size: 13px; margin-bottom: 6px; animation: fadeUpIn 0.8s ease-out 0.2s both;">
        La Boutique de la Elegancia
      </div>
      <div style="color: rgba(255,255,255,0.3); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 28px; animation: fadeUpIn 0.8s ease-out 0.4s both;">
        Cargando...
      </div>

      <!-- Spinner dorado fino -->
      <div style="width: 32px; height: 32px; border: 2px solid rgba(212,175,55,0.15); border-top-color: #D4AF37; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>
  </div>

  <div id="root"></div>

  <!-- Loading Logic -->
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('loadingScreen');
      if (loader) {
        setTimeout(() => {
          loader.style.opacity = '0';
          setTimeout(() => { loader.remove(); }, 500);
        }, 800);
      }
    });
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
