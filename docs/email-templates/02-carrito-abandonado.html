<!--
  TEMPLATE CARRITO ABANDONADO — La Boutique de la Elegancia
  Se manda solo (cron) a quien dejó productos sin comprar.

  CÓMO USARLO EN EmailJS:
  1. emailjs.com → Email Templates → Create New Template.
  2. Subject (asunto):  Te guardamos tu carrito 🛍️ — La Boutique de la Elegancia
  3. Cuerpo → "</> Code editor" → pegá TODO este archivo.
  4. To Email:  {{to_email}}     To Name:  {{to_name}}
  5. Copiá el Template ID y pegalo en Admin → Configuración → EmailJS →
     "Template — Carrito abandonado".

  Variables: to_name, items_summary, total, recovery_link
-->
<div style="margin:0;padding:0;background:#0a0a0a;font-family:'Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0a0a0a;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:92%;background:#111111;border:1px solid #262626;border-radius:16px;overflow:hidden;">

          <tr>
            <td align="center" style="background:#0a0a0a;padding:36px 24px 28px;border-bottom:1px solid #1f1f1f;">
              <div style="font-family:Georgia,'Times New Roman',serif;font-size:26px;letter-spacing:2px;color:#D4AF37;font-weight:700;">LA BOUTIQUE</div>
              <div style="font-family:Georgia,'Times New Roman',serif;font-size:13px;letter-spacing:6px;color:#9a8347;margin-top:4px;text-transform:uppercase;">de la Elegancia</div>
            </td>
          </tr>

          <tr>
            <td style="padding:34px 40px 8px;" align="center">
              <p style="color:#ffffff;font-size:22px;font-weight:600;margin:0 0 12px;">¿Te quedó algo en el carrito? 🛍️</p>
              <p style="color:#b9b9b9;font-size:15px;line-height:1.6;margin:0;">Hola {{to_name}}, todavía guardamos tus prendas favoritas. ¡Completá tu compra antes de que vuelen!</p>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 40px 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0d0d0d;border:1px solid #242424;border-radius:12px;">
                <tr>
                  <td style="padding:20px 22px;">
                    <p style="color:#7a7a7a;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 6px;">Tu selección</p>
                    <p style="color:#e6e6e6;font-size:14px;line-height:1.6;margin:0 0 16px;">{{items_summary}}</p>
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="color:#7a7a7a;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;">Total</td>
                        <td align="right" style="color:#ffffff;font-size:20px;font-weight:700;">{{total}}</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:28px 40px 36px;">
              <a href="{{recovery_link}}" style="display:inline-block;background:#D4AF37;color:#1a1308;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:14px 34px;border-radius:8px;">
                Completar mi compra
              </a>
            </td>
          </tr>

          <tr>
            <td align="center" style="background:#0a0a0a;padding:24px;border-top:1px solid #1f1f1f;">
              <p style="color:#8a7740;font-family:Georgia,serif;font-size:14px;letter-spacing:1px;margin:0 0 6px;">La Boutique de la Elegancia</p>
              <p style="color:#555555;font-size:11px;margin:0;">Te esperamos 💛</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</div>
